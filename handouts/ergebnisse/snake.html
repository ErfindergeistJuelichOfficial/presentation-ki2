<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Snake Spiel</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        h1 {
            margin-top: 0;
            text-shadow: 2px 2px 4px #000000;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #ecf0f1;
            display: block;
            border: 4px solid #34495e;
            border-radius: 4px;
        }

        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        #gameOverMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            display: none; /* Standardmäßig versteckt */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Snake Spiel</h1>
    <div id="scoreBoard">Punktestand: <span id="score">0</span></div>

    <div id="gameContainer">
        <!-- Das Spielfeld -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Game Over Nachricht -->
        <div id="gameOverMessage" onclick="resetGame()">
            <h2>Game Over!</h2>
            <p>Klicke hier, um neu zu starten.</p>
        </div>
    </div>

    <script>
        // Grundlegende Setup-Variablen
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverDiv = document.getElementById("gameOverMessage");

        // Konfiguration
        const gridSize = 20; // Größe eines Quadrats (Kopf der Schlange)
        const tileCount = canvas.width / gridSize; // Anzahl der Quadrate in Reihe
        
        // Spielstatus
        let score = 0;
        let velocityX = 0;
        let velocityY = 0;
        let snake = [];
        let foodX = 0;
        let foodY = 0;
        let gameInterval;
        let isGameRunning = false;

        // Initialisierung beim Laden der Seite
        window.onload = function() {
            document.addEventListener("keydown", keyPush);
            resetGame();
        };

        // Hauptfunktion: Startet oder setzt das Spiel neu
        function resetGame() {
            gameOverDiv.style.display = "none";
            score = 0;
            scoreElement.innerText = score;
            
            // Schlange in die Mitte setzen
            snake = [
                {x: 10, y: 10}, // Kopf
                {x: 9, y: 10},
                {x: 8, y: 10}   // Schwanz
            ];
            
            velocityX = 1; // Bewegt sich zuerst nach rechts
            velocityY = 0;
            
            spawnFood();
            
            if (gameInterval) clearInterval(gameInterval);
            isGameRunning = true;
            gameInterval = setInterval(gameLoop, 100); // Geschwindigkeit (10ms = ca. 10 FPS)
        }

        // Das Herzstück: Die Spiel-Schleife
        function gameLoop() {
            moveSnake();
            if (checkGameOver()) {
                return;
            }
            drawGame();
        }

        // Schlange bewegen
        function moveSnake() {
            // Neue Kopfposition berechnen
            const head = { 
                x: snake[0].x + velocityX, 
                y: snake[0].y + velocityY 
            };

            // Wenn die Schlange sich bewegt hat (Startzustand)
            if (velocityX !== 0 || velocityY !== 0) {
                // Kopf voran schieben
                snake.unshift(head);
                
                // Prüfen: Hat sie das Essen gegessen?
                if (head.x === foodX && head.y === foodY) {
                    score++;
                    scoreElement.innerText = score;
                    spawnFood();
                } else {
                    // Wenn nicht gefressen, Schwanz entfernen (Bewegungseffekt)
                    snake.pop();
                }
            }
        }

        // Essen platzieren
        function spawnFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);

            // Verhindert, dass Essen auf der Schlange erscheint
            for (let part of snake) {
                if (part.x === foodX && part.y === foodY) {
                    spawnFood(); // Versuche es erneut
                }
            }
        }

        // Zeichnen des Spiels
        function drawGame() {
            // Hintergrund löschen
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Essen zeichnen (Rot)
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 2, gridSize - 2);

            // Schlange zeichnen (Grün)
            for (let i = 0; i < snake.length; i++) {
                // Kopf etwas dunkler als der Rest
                ctx.fillStyle = (i == 0) ? "#27ae60" : "#2ecc71"; 
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
            }
        }

        // Kollisionserkennung (Game Over)
        function checkGameOver() {
            const head = snake[0]; // Wir prüfen gegen den neuen Kopf
            
            // 1. Kollision mit Wänden
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // 2. Kollision mit sich selbst
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        // Steuerung mit Tastatur
        function keyPush(evt) {
            if (!isGameRunning) return;

            switch (evt.keyCode) {
                case 37: // Links
                    if(velocityX !== 1) { // Verhindert Umdrehen direkt zurück nach rechts
                        velocityX = -1; velocityY = 0;
                    }
                    break;
                case 38: // Oben
                    if(velocityY !== 1) {
                        velocityX = 0; velocityY = -1;
                    }
                    break;
                case 39: // Rechts
                    if(velocityX !== -1) {
                        velocityX = 1; velocityY = 0;
                    }
                    break;
                case 40: // Unten
                    if(velocityY !== -1) {
                        velocityX = 0; velocityY = 1;
                    }
                    break;
            }
        }

        // Erstes Zeichnen (vor Start)
        drawGame();
    </script>
</body>
</html>
