<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Snake Spiel</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            flex-direction: column;
        }

        #gameCanvas {
            background-color: #000;
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Punkte: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">Steuerung: Pfeiltasten | Neustart: Leertaste</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreBoard");

        // Spiel-Einstellungen
        const gridSize = 20; // Größe eines Kästchens in Pixeln
        const tileCount = canvas.width / gridSize; // Anzahl der Kästchen pro Reihe/Spalte
        
        let score = 0;
        
        // Geschwindigkeit des Spiels (Frame-Intervall in ms)
        const gameSpeed = 100; 

        // Spielstatus
        let velocityX = 0;
        let velocityY = 0;
        
        // Snake Position und Körper
        let snake = [];
        let tailLength = 5;

        // Futter Position
        let foodX = 5;
        let foodY = 5;

        // Startposition (Mitte)
        let playerX = 10;
        let playerY = 10;

        // Spielstart initialisieren
        snake.push({x: playerX, y: playerY}); // Kopf
        
        // Game Loop starten
        window.onload = function() {
            document.addEventListener("keydown", keyPush);
            setInterval(game, gameSpeed);
        };

        function game() {
            // Position aktualisieren
            playerX += velocityX;
            playerY += velocityY;

            // Kollision mit Wänden (Game Over / Reset)
            if (playerX < 0 || playerX >= tileCount || playerY < 0 || playerY >= tileCount) {
                resetGame();
            }

            // Hintergrund zeichnen
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Schlange zeichnen
            ctx.fillStyle = "#2ecc71"; // Grün
            for (let i = 0; i < snake.length; i++) {
                // Jedes Segment ist ein Quadrat
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);

                // Kollision mit dem eigenen Schwanz prüfen
                if (snake[i].x === playerX && snake[i].y === playerY) {
                    // Wir ignorieren die Kollision beim Start oder wenn wir stillstehen
                    if (velocityX !== 0 || velocityY !== 0) {
                        resetGame();
                    }
                }
            }

            // Neuen Kopf hinzufügen
            snake.push({x: playerX, y: playerY});

            // Schwanz abschneiden, falls er zu lang wird (außer bei Futteressen)
            while (snake.length > tailLength + score) {
                snake.shift();
            }

            // Futter zeichnen
            ctx.fillStyle = "#e74c3c"; // Rot
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 2, gridSize - 2);

            // Prüfen ob Futter gegessen wurde
            if (playerX === foodX && playerY === foodY) {
                score++;
                scoreElement.innerText = "Punkte: " + score;
                
                // Neues Futter spawnen
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
            }
        }

        function resetGame() {
            playerX = 10;
            playerY = 10;
            velocityX = 0;
            velocityY = 0;
            score = 0;
            tailLength = 5;
            snake = []; // Liste zurücksetzen
            scoreElement.innerText = "Punkte: 0";
        }

        function keyPush(evt) {
            switch (evt.keyCode) {
                case 37: // Links
                    if (velocityX !== 1) { velocityX = -1; velocityY = 0; }
                    break;
                case 38: // Oben
                    if (velocityY !== 1) { velocityX = 0; velocityY = -1; }
                    break;
                case 39: // Rechts
                    if (velocityX !== -1) { velocityX = 1; velocityY = 0; }
                    break;
                case 40: // Unten
                    if (velocityY !== -1) { velocityX = 0; velocityY = 1; }
                    break;
                case 32: // Leertaste (Neustart)
                    resetGame();
                    break;
            }
        }
    </script>
</body>
</html>
