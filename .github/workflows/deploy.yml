name: 🚀 Deploy Presentation ki2

on:
  push:
    branches:    
      - 'main' 

jobs:
  web-deploy:
    name: 🎉 Deploy at https://erfindergeist.org/
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v6

    - name: quarto setup
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        tinytex: true

    - name: install rsvg-convert
      run: sudo apt-get install -y librsvg2-bin poppler-utils

    - name: quarto render website & pdf
      uses: quarto-dev/quarto-actions/render@v2

    - name: 🖨️ Plakat (A3, A4, A5) und Flyer (A5) als PDF erzeugen
      run: |
        ./drucksachen/pdf.sh
        mkdir -p _site/drucksachen
        cp drucksachen/plakat-a3.pdf drucksachen/plakat-a4.pdf drucksachen/plakat-a5.pdf drucksachen/flyer-a5.pdf drucksachen/flyer-a5-vorderseite.pdf drucksachen/flyer-a5-rueckseite.pdf _site/drucksachen/

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: erfindergeist.org
        username: ${{ secrets.FTP_USERNAME_SHARE }}
        password: ${{ secrets.FTP_PASSWORD_SHARE }}
        local-dir: ./_site/
        protocol: ftps
        state-name: .ftp-deploy-presentation-ki2.json
        server-dir: /presentations/ki2/
        exclude: |
          index.html